services:
  backend:
    image: ${ACR}/ticket-backend:latest
    restart: unless-stopped
    environment:
      AUTH_MODE: keycloak
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: lvmh-tickets
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      # URL publique du frontend déployé (Azure Container Apps) — utilisée pour
      # construire les liens dans les emails de notification et pour CORS.
      PLATFORM_URL: https://frontend-smartdispatch.whitepond-b737dca4.polandcentral.azurecontainerapps.io
      FRONTEND_ORIGIN: https://frontend-smartdispatch.whitepond-b737dca4.polandcentral.azurecontainerapps.io
    volumes:
      - backend-data:/data
    depends_on:
      - keycloak

  frontend:
    image: ${ACR}/ticket-frontend:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

  keycloak:
    image: ${ACR}/keycloak-lvmh:latest
    entrypoint: ["/opt/keycloak/bin/kc.sh", "start", "--import-realm"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KC_HOSTNAME: https://smartdispatch-tickets.polandcentral.cloudapp.azure.com/auth
      KC_PROXY_HEADERS: xforwarded
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://pg-keycloak-k8s.postgres.database.azure.com:5432/keycloak
      KC_DB_USERNAME: kcadmin
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

volumes:
  backend-data:
  prometheus-data:
  grafana-data:
