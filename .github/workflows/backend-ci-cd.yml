name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Ticket-Classifier--main - Copie/**'
      - '.github/workflows/backend-ci-cd.yml'
  workflow_dispatch: {}

env:
  ACR_LOGIN_SERVER: acrticketk8s.azurecr.io
  IMAGE_NAME: ticket-backend
  CONTAINER_APP: backend-smartdispatch
  RESOURCE_GROUP: rg-smartdispatch-prod
  WORKDIR: 'Ticket-Classifier--main - Copie'

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        working-directory: ${{ env.WORKDIR }}
        run: ruff check . --output-format=github

  build-scan-push:
    name: Build, scan (Trivy) & push
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'  # passe à '1' pour bloquer le pipeline sur vulnérabilité critique une fois stabilisé

      # Pas de Service Principal Azure disponible sur ce compte (droits d'annuaire
      # restreints) — le déploiement reste manuel pour l'instant. La commande exacte
      # à lancer est affichée dans le résumé du run (onglet Summary de ce job).
      - name: Print manual deploy command
        run: |
          echo "### Déploiement manuel requis" >> "$GITHUB_STEP_SUMMARY"
          echo '```powershell' >> "$GITHUB_STEP_SUMMARY"
          echo "az containerapp update \`" >> "$GITHUB_STEP_SUMMARY"
          echo "  --name ${{ env.CONTAINER_APP }} \`" >> "$GITHUB_STEP_SUMMARY"
          echo "  --resource-group ${{ env.RESOURCE_GROUP }} \`" >> "$GITHUB_STEP_SUMMARY"
          echo "  --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"