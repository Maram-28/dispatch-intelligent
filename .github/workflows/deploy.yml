name: CI/CD to Azure VM

on:
  push:
    branches: [main]

env:
  ACR: acrticketk8s.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login $ACR -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build & push backend
        run: |
          docker build -t $ACR/ticket-backend:latest "./Ticket-Classifier--main - Copie"
          docker push $ACR/ticket-backend:latest

      - name: Build & push frontend
        run: |
          docker build -t $ACR/ticket-frontend:latest ./frontend
          docker push $ACR/ticket-frontend:latest

      - name: Build & push keycloak
        run: |
          docker build -t $ACR/keycloak-lvmh:latest ./infra/keycloak
          docker push $ACR/keycloak-lvmh:latest

      - name: Copy compose files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.yml,monitoring/prometheus.yml"
          target: "~/app"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: azureuser
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/app
            echo "ACR=${{ env.ACR }}" > .env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> .env
            echo "AZURE_OPENAI_API_KEY=${{ secrets.AZURE_OPENAI_API_KEY }}" >> .env
            echo "KC_DB_PASSWORD=${{ secrets.KC_DB_PASSWORD }}" >> .env
            echo "KEYCLOAK_ADMIN_PASSWORD=${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" >> .env
            echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> .env
            docker login $ACR -u "${{ secrets.ACR_USERNAME }}" -p "${{ secrets.ACR_PASSWORD }}"
            docker compose pull
            docker compose up -d
